<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Freecam</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    width: 100vw; height: 100vh;
    overflow: hidden;
    pointer-events: none;
}
#notifications {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 9999; pointer-events: none;
}
.notif {
    background: rgba(10,10,10,0.92);
    border-radius: 8px; padding: 10px 20px;
    color: #fff; font-size: 13px; font-weight: 500;
    border-left: 3px solid #7df3c1;
    animation: notifIn 0.3s ease;
    backdrop-filter: blur(10px);
    min-width: 220px; text-align: center;
}
.notif.success { border-color: #7df3c1; }
.notif.error   { border-color: #f37d7d; }
.notif.info    { border-color: #7db6f3; }
.notif.warning { border-color: #f3c17d; }
@keyframes notifIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}
#freecam-panel {
    display: none;
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
    width: 240px;
    background: rgba(8,8,8,0.88);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; overflow: hidden;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    pointer-events: none;
}
#freecam-panel.visible {
    display: block;
    animation: panelIn 0.25s ease;
}
@keyframes panelIn {
    from { opacity: 0; transform: translateY(-50%) scale(0.95); }
    to   { opacity: 1; transform: translateY(-50%) scale(1); }
}
.fc-header {
    background: rgba(125,243,193,0.08);
    border-bottom: 1px solid rgba(125,243,193,0.12);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 8px;
}
.fc-header-icon {
    width: 8px; height: 8px; border-radius: 50%;
    background: #7df3c1; box-shadow: 0 0 8px #7df3c1;
    animation: pulse 1.5s infinite;
}
@keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
}
.fc-header-title {
    font-size: 11px; font-weight: 700;
    letter-spacing: 2.5px; text-transform: uppercase; color: #7df3c1;
}
.fc-header-speed {
    margin-right: auto; font-size: 10px; color: rgba(255,255,255,0.35);
}
.fc-options { padding: 8px 0; }
.fc-option {
    display: flex; align-items: center;
    padding: 9px 14px; font-size: 12px;
    color: rgba(255,255,255,0.45);
    transition: all 0.15s; position: relative; gap: 10px;
}
.fc-option.hovered {
    background: rgba(125,243,193,0.07); color: #fff;
}
.fc-option.hovered::before {
    content: ''; position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 2px; background: #7df3c1;
    border-radius: 2px 0 0 2px;
}
.fc-option-icon { font-size: 13px; width: 18px; text-align: center; flex-shrink: 0; }
.fc-option-label { flex: 1; }
.fc-option-arrow { font-size: 9px; color: #7df3c1; opacity: 0; }
.fc-option.hovered .fc-option-arrow { opacity: 1; }
.fc-sub { display: none; padding: 0 14px 10px; border-top: 1px solid rgba(255,255,255,0.04); }
.fc-sub.visible { display: block; }
.fc-sub-row { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; }
.fc-sub-label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; }
.fc-sub-value { font-size: 11px; color: #7df3c1; font-weight: 600; }
.fc-sub-arrows { display: flex; align-items: center; gap: 6px; font-size: 10px; color: rgba(255,255,255,0.3); }
.fc-sub-arrows span { color: rgba(125,243,193,0.7); }
.fc-hint {
    padding: 10px 14px;
    border-top: 1px solid rgba(255,255,255,0.04);
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px;
}
.fc-hint-row { display: flex; align-items: center; gap: 5px; }
.fc-hint-key {
    background: rgba(255,255,255,0.07); border-radius: 3px;
    padding: 1px 5px; font-size: 9px; color: #7df3c1;
    font-family: monospace; border: 1px solid rgba(255,255,255,0.06);
}
.fc-hint-desc { font-size: 9px; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<div id="notifications"></div>

<div id="freecam-panel">
    <div class="fc-header">
        <div class="fc-header-icon"></div>
        <div class="fc-header-title">Freecam</div>
        <div class="fc-header-speed" id="fc-speed">0.5x</div>
    </div>
    <div class="fc-options" id="fc-options"></div>
    <div class="fc-sub" id="fc-sub">
        <div class="fc-sub-row">
            <div>
                <div class="fc-sub-label" id="fc-sub-label">Weapon</div>
                <div class="fc-sub-value" id="fc-sub-value">—</div>
            </div>
            <div class="fc-sub-arrows"><span>◄</span> scroll <span>►</span></div>
        </div>
    </div>
    <div class="fc-hint">
        <div class="fc-hint-row"><span class="fc-hint-key">W/S</span><span class="fc-hint-desc">أمام/خلف</span></div>
        <div class="fc-hint-row"><span class="fc-hint-key">A/D</span><span class="fc-hint-desc">يمين/يسار</span></div>
        <div class="fc-hint-row"><span class="fc-hint-key">Space</span><span class="fc-hint-desc">أعلى</span></div>
        <div class="fc-hint-row"><span class="fc-hint-key">Ctrl</span><span class="fc-hint-desc">أسفل</span></div>
        <div class="fc-hint-row"><span class="fc-hint-key">↑↓</span><span class="fc-hint-desc">خيارات</span></div>
        <div class="fc-hint-row"><span class="fc-hint-key">Enter</span><span class="fc-hint-desc">تنفيذ</span></div>
        <div class="fc-hint-row"><span class="fc-hint-key">Shift</span><span class="fc-hint-desc">تسريع</span></div>
        <div class="fc-hint-row"><span class="fc-hint-key">Esc</span><span class="fc-hint-desc">إغلاق</span></div>
    </div>
</div>

<script>
const state = {
    options: [], weapons: [], vehicles: [],
    hoveredIndex: 0, weaponIndex: 0, vehicleIndex: 0, speed: 0.5
};

const ICONS = {
    "Default": "🎥", "Teleport": "📍", "Shoot Weapon": "🔫",
    "Kick from Vehicle": "🚗", "Hijack Vehicle": "🔑", "Delete Vehicle": "💥"
};

const WEAPON_OPTS  = ["Shoot Weapon"];
const VEHICLE_OPTS = ["Kick from Vehicle", "Hijack Vehicle", "Delete Vehicle"];

function renderOptions() {
    const container = document.getElementById('fc-options');
    container.innerHTML = '';
    state.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'fc-option' + (i === state.hoveredIndex ? ' hovered' : '');
        div.innerHTML = `
            <span class="fc-option-icon">${ICONS[opt] || '•'}</span>
            <span class="fc-option-label">${opt}</span>
            <span class="fc-option-arrow">◄</span>`;
        container.appendChild(div);
    });
    updateSub();
}

function updateSub() {
    const sub   = document.getElementById('fc-sub');
    const label = document.getElementById('fc-sub-label');
    const value = document.getElementById('fc-sub-value');
    const opt   = state.options[state.hoveredIndex];
    if (WEAPON_OPTS.includes(opt)) {
        sub.classList.add('visible');
        label.textContent = 'Weapon';
        value.textContent = state.weapons[state.weaponIndex] || '—';
    } else if (VEHICLE_OPTS.includes(opt)) {
        sub.classList.add('visible');
        label.textContent = 'Vehicle';
        value.textContent = state.vehicles[state.vehicleIndex] || '—';
    } else {
        sub.classList.remove('visible');
    }
}

function showNotification(type, title, desc, duration) {
    const el = document.createElement('div');
    el.className = `notif ${type}`;
    el.innerHTML = `<b>${title}</b>${desc ? ' — ' + desc : ''}`;
    document.getElementById('notifications').appendChild(el);
    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(() => el.remove(), 300);
    }, duration || 3000);
}

window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || !data.action) return;

    if (data.action === 'displayFreecam') {
        const panel = document.getElementById('freecam-panel');
        if (data.visible) {
            if (data.options)  state.options  = data.options;
            if (data.weapons)  state.weapons  = data.weapons;
            if (data.vehicles) state.vehicles = data.vehicles;
            if (data.hoveredIndex !== undefined) state.hoveredIndex = data.hoveredIndex - 1;
            if (data.weaponIndex  !== undefined) state.weaponIndex  = data.weaponIndex  - 1;
            if (data.vehicleIndex !== undefined) state.vehicleIndex = data.vehicleIndex - 1;
            panel.classList.add('visible');
            renderOptions();
        } else {
            panel.classList.remove('visible');
        }
    }

    else if (data.action === 'freecamHover') {
        state.hoveredIndex = (data.hoveredIndex || 1) - 1;
        renderOptions();
    }

    else if (data.action === 'freecamWeapon') {
        state.weaponIndex = (data.weaponIndex || 1) - 1;
        updateSub();
    }

    else if (data.action === 'freecamVehicle') {
        state.vehicleIndex = (data.vehicleIndex || 1) - 1;
        updateSub();
    }

    else if (data.action === 'freecamSpeed') {
        state.speed = data.speed;
        document.getElementById('fc-speed').textContent = parseFloat(data.speed).toFixed(1) + 'x';
    }

    else if (data.action === 'showNotification') {
        showNotification(data.type, data.title, data.desc, data.duration);
    }
});
</script>
</body>
</html>
