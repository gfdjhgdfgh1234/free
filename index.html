<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    font-family: 'Arial', sans-serif;
}

/* NOTIFICATIONS */
#notifications {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 9999;
}
.notif {
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 4px;
    animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* FREECAM OPTIONS — نفس شكل الأصل */
#freecam-panel {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
}

#freecam-panel.visible {
    display: block;
}

.fc-item {
    display: block;
    font-size: 15px;
    color: rgba(255, 255, 255, 0.45);
    line-height: 1.9;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    transition: color 0.1s;
    white-space: nowrap;
}

.fc-item.selected {
    color: rgba(255, 255, 255, 0.95);
    font-size: 15px;
}

/* السلاح / المركبة تحت القائمة */
#fc-sub {
    display: none;
    margin-top: 10px;
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    letter-spacing: 0.5px;
    text-align: center;
}
#fc-sub.visible { display: block; }

/* تلميح السرعة */
#fc-speed {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    display: none;
}
#fc-speed.visible { display: block; }
</style>
</head>
<body>

<div id="notifications"></div>

<div id="freecam-panel">
    <div id="fc-options"></div>
    <div id="fc-sub"></div>
</div>

<div id="fc-speed"></div>

<script>
const state = {
    options: [], weapons: [], vehicles: [],
    hoveredIndex: 0, weaponIndex: 0, vehicleIndex: 0, speed: 0.5
};

const WEAPON_OPTS  = ["Shoot Weapon"];
const VEHICLE_OPTS = ["Kick from Vehicle", "Hijack Vehicle", "Delete Vehicle", "Spawn Vehicle"];

function renderOptions() {
    const container = document.getElementById('fc-options');
    container.innerHTML = '';

    state.options.forEach((opt, i) => {
        const span = document.createElement('span');
        span.className = 'fc-item' + (i === state.hoveredIndex ? ' selected' : '');

        if (i === state.hoveredIndex) {
            span.textContent = '~ ' + opt + ' ~';
        } else {
            span.textContent = opt;
        }

        container.appendChild(span);
    });

    updateSub();

    // speed hint
    const spd = document.getElementById('fc-speed');
    spd.textContent = 'Speed: ' + parseFloat(state.speed).toFixed(1) + '  |  +/- to adjust';
    spd.classList.add('visible');
}

function updateSub() {
    const sub = document.getElementById('fc-sub');
    const opt = state.options[state.hoveredIndex];

    if (WEAPON_OPTS.includes(opt) && state.weapons.length > 0) {
        sub.classList.add('visible');
        const w = state.weapons[state.weaponIndex] || '—';
        sub.textContent = '◄  ' + w + '  ►';
    } else if (VEHICLE_OPTS.includes(opt) && state.vehicles.length > 0) {
        sub.classList.add('visible');
        const v = state.vehicles[state.vehicleIndex] || '—';
        sub.textContent = '◄  ' + v + '  ►';
    } else {
        sub.classList.remove('visible');
    }
}

function showNotification(type, title, desc, duration) {
    const el = document.createElement('div');
    el.className = 'notif';
    el.textContent = (title ? title + (desc ? ': ' + desc : '') : desc);
    document.getElementById('notifications').appendChild(el);
    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(() => el.remove(), 300);
    }, duration || 3000);
}

window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || !data.action) return;

    switch (data.action) {
        case 'displayFreecam': {
            const panel = document.getElementById('freecam-panel');
            const spd   = document.getElementById('fc-speed');
            if (data.visible) {
                if (data.options)  state.options  = data.options;
                if (data.weapons)  state.weapons  = data.weapons;
                if (data.vehicles) state.vehicles = data.vehicles;
                if (data.hoveredIndex !== undefined) state.hoveredIndex = data.hoveredIndex - 1;
                if (data.weaponIndex  !== undefined) state.weaponIndex  = data.weaponIndex  - 1;
                if (data.vehicleIndex !== undefined) state.vehicleIndex = data.vehicleIndex - 1;
                if (data.speed !== undefined) state.speed = data.speed;
                panel.classList.add('visible');
                renderOptions();
            } else {
                panel.classList.remove('visible');
                spd.classList.remove('visible');
            }
            break;
        }
        case 'freecamHover': {
            state.hoveredIndex = (data.hoveredIndex || 1) - 1;
            renderOptions();
            break;
        }
        case 'freecamWeapon': {
            state.weaponIndex = (data.weaponIndex || 1) - 1;
            updateSub();
            break;
        }
        case 'freecamVehicle': {
            state.vehicleIndex = (data.vehicleIndex || 1) - 1;
            updateSub();
            break;
        }
        case 'freecamSpeed': {
            state.speed = data.speed;
            document.getElementById('fc-speed').textContent =
                'Speed: ' + parseFloat(data.speed).toFixed(1) + '  |  +/- to adjust';
            break;
        }
        case 'showNotification': {
            showNotification(data.type, data.title, data.desc, data.duration);
            break;
        }
    }
});
</script>
</body>
</html>
