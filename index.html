<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    background: transparent !important;
    background-color: transparent !important;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
}

/* ================== NOTIFICATIONS ================== */
#notifications {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 9999;
    background: transparent !important;
}

/* تصميم نوتيفاي نظيف بدون backdrop-filter لإزالة المربع الأسود نهائياً */
.notif {
    background: rgba(20, 20, 20, 0.75);
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 20px;
    border-radius: 4px;
    border-left: 3px solid #7df3c1;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    animation: slideDown 0.2s ease-out;
    text-shadow: 1px 1px 2px #000;
}

.notif.success { border-left-color: #2ed573; }
.notif.error   { border-left-color: #ff4757; }
.notif.warning { border-left-color: #ffa502; }
.notif.info    { border-left-color: #1e90ff; }

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ================== FREECAM LIST ================== */
/* موقع القائمة: تحت المنتصف (top: 65%) */
#freecam-panel {
    display: none;
    position: fixed;
    top: 65%;
    left: 50%;
    transform: translate(-50%, 0);
    text-align: center;
    pointer-events: none;
    background: transparent !important;
}

#freecam-panel.visible {
    display: block;
}

.fc-item {
    display: block;
    font-size: 14px;
    color: rgba(220, 220, 220, 0.45);
    line-height: 1.8;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 1), 0 0 5px rgba(0, 0, 0, 0.9);
    transition: all 0.05s ease;
    white-space: nowrap;
}

/* الخيار المحدد يظهر باللون الأحمر والمميز */
.fc-item.selected {
    color: #ff4757;
    font-weight: 700;
    font-size: 15px;
    text-shadow: 1px 1px 3px #000, 0 0 8px rgba(255, 71, 87, 0.6);
}
</style>
</head>
<body>

<div id="notifications"></div>

<div id="freecam-panel">
    <div id="fc-options"></div>
</div>

<script>
let currentFeatures = [];
let currentIndex = 1;
let currentSub = "";

function renderMenu() {
    const container = document.getElementById('fc-options');
    container.innerHTML = '';

    currentFeatures.forEach((feat, i) => {
        const span = document.createElement('span');
        const isSelected = (i + 1 === currentIndex);
        span.className = 'fc-item' + (isSelected ? ' selected' : '');

        if (isSelected) {
            if (currentSub && currentSub !== "") {
                span.textContent = `Q | ${feat} (${currentSub}) | E`;
            } else {
                span.textContent = `~ ${feat} ~`;
            }
        } else {
            span.textContent = feat;
        }

        container.appendChild(span);
    });
}

function showNotification(type, title, desc, duration) {
    const container = document.getElementById('notifications');
    const el = document.createElement('div');
    el.className = `notif ${type}`;
    el.innerHTML = `<b>${title}</b>${desc ? ': ' + desc : ''}`;
    container.appendChild(el);

    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s ease';
        setTimeout(() => el.remove(), 200);
    }, duration || 2500);
}

window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || !data.action) return;

    if (data.action === 'displayFreecam') {
        const panel = document.getElementById('freecam-panel');
        if (data.visible) {
            panel.classList.add('visible');
        } else {
            panel.classList.remove('visible');
        }
    }

    else if (data.action === 'updateState') {
        currentFeatures = data.features || [];
        currentIndex = data.currentFeature || 1;
        currentSub = data.subValue || "";
        renderMenu();
    }

    else if (data.action === 'showNotification') {
        showNotification(data.type, data.title, data.desc, data.duration);
    }
});
</script>
</body>
</html>
