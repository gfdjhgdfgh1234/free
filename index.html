<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
}

/* ================== NOTIFICATIONS ================== */
#notifications {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 9999;
}

.notif {
    background: rgba(14, 14, 14, 0.88);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 22px;
    border-radius: 6px;
    border-left: 3px solid #7df3c1;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    animation: slideDown 0.25s ease;
    backdrop-filter: blur(6px);
    text-shadow: 1px 1px 2px #000;
}

.notif.success { border-color: #7df3c1; }
.notif.error   { border-color: #ff6b6b; }
.notif.warning { border-color: #feca57; }
.notif.info    { border-color: #54a0ff; }

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ================== FREECAM TEXT LIST ================== */
/* موقع القائمة: منخفضة تحت منتصف الشاشة (top: 65%) */
#freecam-panel {
    display: none;
    position: fixed;
    top: 65%;
    left: 50%;
    transform: translate(-50%, 0);
    text-align: center;
    pointer-events: none;
}

#freecam-panel.visible {
    display: block;
}

.fc-item {
    display: block;
    font-size: 14px;
    color: rgba(230, 230, 230, 0.45);
    line-height: 1.8;
    letter-spacing: 0.6px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.9);
    transition: all 0.08s ease;
    white-space: nowrap;
}

/* العنصر المحدد باللون الأحمر/المميز كما كان في كودك */
.fc-item.selected {
    color: #ff4757;
    font-weight: 700;
    font-size: 16px;
    text-shadow: 1px 1px 3px #000, 0 0 10px rgba(255, 71, 87, 0.6);
}
</style>
</head>
<body>

<!-- شريط النوتيفاي -->
<div id="notifications"></div>

<!-- قائمة الخيارات النصية -->
<div id="freecam-panel">
    <div id="fc-options"></div>
</div>

<script>
let currentFeatures = [];
let currentIndex = 1;
let currentSub = "";

function renderMenu() {
    const container = document.getElementById('fc-options');
    container.innerHTML = '';

    currentFeatures.forEach((feat, i) => {
        const span = document.createElement('span');
        const isSelected = (i + 1 === currentIndex);
        span.className = 'fc-item' + (isSelected ? ' selected' : '');

        if (isSelected) {
            if (currentSub && currentSub !== "") {
                span.textContent = `Q | ${feat} (${currentSub}) | E`;
            } else {
                span.textContent = `~ ${feat} ~`;
            }
        } else {
            span.textContent = feat;
        }

        container.appendChild(span);
    });
}

function showNotification(type, title, desc, duration) {
    const container = document.getElementById('notifications');
    const el = document.createElement('div');
    el.className = `notif ${type}`;
    el.innerHTML = `<b>${title}</b>${desc ? ': ' + desc : ''}`;
    container.appendChild(el);

    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 250);
    }, duration || 2500);
}

window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || !data.action) return;

    if (data.action === 'displayFreecam') {
        const panel = document.getElementById('freecam-panel');
        if (data.visible) {
            panel.classList.add('visible');
        } else {
            panel.classList.remove('visible');
        }
    }

    else if (data.action === 'updateState') {
        currentFeatures = data.features || [];
        currentIndex = data.currentFeature || 1;
        currentSub = data.subValue || "";
        renderMenu();
    }

    else if (data.action === 'showNotification') {
        showNotification(data.type, data.title, data.desc, data.duration);
    }
});
</script>
</body>
</html>
